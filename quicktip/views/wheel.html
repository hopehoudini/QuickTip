<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}#wheel{position:fixed;left:50%;top:50%;width:360px;height:360px;transform:translate(-50%,-50%);border-radius:50%;background:#121a2ddd;border:1px solid #6f86d9;box-shadow:0 12px 60px #0008}.slot{position:absolute;width:92px;height:58px;margin:-29px -46px;border-radius:12px;background:#27345a;color:#fff;text-align:center;display:flex;align-items:center;justify-content:center;font:14px Segoe UI;cursor:pointer;padding:0 8px}.slot.sel{background:#6985ff;box-shadow:0 0 20px #7890ff}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#aebcf2;font:12px Segoe UI}</style></head><body><div id="wheel"><div class="center">松开选择</div></div><script>let slots=[];function placeWheel(x,y){const w=document.querySelector("#wheel");w.style.left=x+"px";w.style.top=y+"px"}async function init(){slots=(await window.pywebview.api.state()).prompts.filter(p=>p.enabled);let pos=await window.pywebview.api.mouse_position();placeWheel(pos.x,pos.y);const w=document.querySelector('#wheel');slots.forEach((p,i)=>{let a=i*2*Math.PI/slots.length-Math.PI/2;let x=180+Math.cos(a)*140,y=180+Math.sin(a)*140;let d=document.createElement('div');d.className='slot';d.textContent=p.title;d.style.left=x+'px';d.style.top=y+'px';d.onmouseenter=()=>d.classList.add('sel');d.onclick=()=>choose(p.id);w.appendChild(d)})}async function choose(id){await window.pywebview.api.choose(id);await window.pywebview.api.close()}window.addEventListener('pywebviewready',init);</script></body></html>
