<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>QuickTip</title><style>
:root{font-family:Segoe UI, sans-serif;color:#eaf0ff;background:#101525}body{margin:0;padding:28px}h1{margin:0 0 18px}.toolbar{display:flex;gap:10px;margin-bottom:18px}button{border:0;border-radius:8px;padding:9px 14px;background:#5b7cfa;color:#fff;cursor:pointer}button.danger{background:#ad4057}.card{background:#19223a;border:1px solid #2e3c61;border-radius:12px;padding:14px;margin:10px 0}.muted{color:#94a3c7;font-size:12px}.row{display:flex;justify-content:space-between;gap:16px}.content{white-space:pre-wrap;color:#d5ddf7}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center}.panel{background:#19223a;padding:22px;border-radius:14px;width:500px}input,textarea{width:100%;box-sizing:border-box;margin:7px 0 14px;padding:10px;border-radius:7px;border:1px solid #405078;background:#0f1729;color:#fff}textarea{height:130px}.actions{display:flex;justify-content:flex-end;gap:8px}</style></head><body><h1>QuickTip</h1><div class="muted">按住 Ctrl + Space 呼出轮盘，移动鼠标选择，松开提交</div><div class="toolbar"><label class="muted">轮盘快捷键 <input id="hotkey" readonly value="Ctrl + Space" onclick="startRecord()" style="width:150px;margin:0 6px;padding:7px;cursor:pointer"></label><button onclick="openForm()">+ 新增提示词</button><button onclick="location.reload()">刷新</button></div><div id="list"></div><div class="modal" id="modal"><div class="panel"><h2 id="formTitle">新增提示词</h2><input id="title" placeholder="标题"><textarea id="content" placeholder="提示词内容"></textarea><div class="actions"><button onclick="closeForm()">取消</button><button onclick="save()">保存</button></div></div></div><script>
let editing=null; async function api(n,...a){return await window.pywebview.api[n](...a)} async function render(){let s=await api('state');hotkey.value=s.hotkey||'ctrl+space'; document.querySelector('#list').innerHTML=s.prompts.map(p=>`<div class="card"><div class="row"><strong>${esc(p.title)}</strong><span><button onclick='edit(${JSON.stringify(p)})'>编辑</button> <button class="danger" onclick="delp('${p.id}')">删除</button></span></div><div class="content">${esc(p.content)}</div><div class="muted">${p.enabled?'已启用':'已停用'}</div></div>`).join('')||'<p class="muted">暂无提示词</p>'} async function setHotkey(v){await api('set_hotkey',v)} function startRecord(){hotkey.value='请按组合键…';const done=e=>{e.preventDefault();const a=[];if(e.ctrlKey)a.push('Ctrl');if(e.altKey)a.push('Alt');if(e.shiftKey)a.push('Shift');if(!['Control','Alt','Shift'].includes(e.key))a.push(e.key.length===1?e.key.toUpperCase():e.key);if(a.length>=2){const v=a.join('+');hotkey.value=v;setHotkey(v.toLowerCase());window.removeEventListener('keydown',done)}};window.addEventListener('keydown',done)} function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))} function openForm(){editing=null;formTitle.textContent='新增提示词';title.value='';content.value='';modal.style.display='flex'} function edit(p){editing=p.id;formTitle.textContent='编辑提示词';title.value=p.title;content.value=p.content;modal.style.display='flex'} function closeForm(){modal.style.display='none'} async function save(){if(editing) await api('update_prompt',editing,title.value,content.value,true);else await api('add_prompt',title.value,content.value);closeForm();render()} async function delp(id){if(confirm('删除这条提示词？')){await api('delete_prompt',id);render()}} window.addEventListener('pywebviewready',render);</script></body></html>
