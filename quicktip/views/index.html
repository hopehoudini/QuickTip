<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>QuickTip</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Segoe UI,system-ui;color:#eef3ff;background:#0b1020}header{display:flex;justify-content:space-between;align-items:center;padding:24px 32px;border-bottom:1px solid #202b49;background:#10172b}h1{margin:0;font-size:25px}.brand{display:flex;gap:12px;align-items:center}.logo{width:34px;height:34px;border-radius:10px;background:#6582ff;display:grid;place-items:center;font-weight:700}.sub{color:#8fa0c7;font-size:12px;margin-top:4px}.wrap{padding:24px 32px;max-width:1100px;margin:auto}.controls{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.actions{display:flex;gap:10px}button{border:0;border-radius:9px;padding:10px 15px;background:#5f7cff;color:#fff;cursor:pointer;font-weight:600}button.secondary{background:#202d4d}button.danger{background:#b94d65}.shortcut{display:flex;align-items:center;gap:10px;color:#91a2c8}.shortcut input{width:150px;margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}.card{background:#131d35;border:1px solid #27385f;border-radius:14px;padding:16px;min-height:145px;display:flex;flex-direction:column;justify-content:space-between}.card:hover{border-color:#7189ff}.cardtop,.cardbottom{display:flex;justify-content:space-between;align-items:center;gap:8px}.title{font-size:16px;font-weight:700}.content{white-space:pre-wrap;color:#bfcbea;line-height:1.5;margin:16px 0}.muted{color:#8192b9;font-size:12px}.mini{padding:6px 9px;font-size:12px}.modal{position:fixed;inset:0;background:#050914bb;display:none;align-items:center;justify-content:center}.panel{background:#151f38;border:1px solid #344874;padding:24px;border-radius:16px;width:min(520px,calc(100% - 40px));box-shadow:0 22px 70px #0009}.panel h2{margin-top:0}input,textarea{width:100%;padding:11px;border-radius:9px;border:1px solid #3a4e7c;background:#0d1528;color:#fff;margin:7px 0 14px}textarea{height:150px;resize:vertical}.formactions{display:flex;justify-content:flex-end;gap:10px}</style></head><body><header><div class="brand"><div class="logo">Q</div><div><h1>QuickTip</h1><div class="sub">快速提示词轮盘</div></div></div><div class="sub">按住快捷键，移动选择，松开提交</div></header><main class="wrap"><div class="controls"><div class="shortcut">轮盘快捷键 <input id="hotkey" readonly value="Ctrl + Space" onclick="startRecord()"></div><div class="actions"><button onclick="openForm()">+ 新增提示词</button><button class="secondary" onclick="location.reload()">刷新</button></div></div><div id="list" class="grid"></div></main><div class="modal" id="modal"><div class="panel"><h2 id="formTitle">新增提示词</h2><input id="title" placeholder="标题"><textarea id="content" placeholder="输入提示词内容"></textarea><div class="formactions"><button class="secondary" onclick="closeForm()">取消</button><button onclick="save()">保存</button></div></div></div><script>
let editing=null;async function api(n,...a){return await window.pywebview.api[n](...a)}async function render(){let s=await api('state');hotkey.value=s.hotkey||'ctrl+space';list.innerHTML=s.prompts.map(p=>`<article class="card"><div class="cardtop"><div class="title">${esc(p.title)}</div><div><button class="mini" onclick='edit(${JSON.stringify(p)})'>编辑</button> <button class="mini danger" onclick="delp('${p.id}')">删除</button></div></div><div class="content">${esc(p.content)}</div><div class="cardbottom"><span class="muted">${p.enabled?'已启用':'已停用'}</span></div></article>`).join('')||'<p class="muted">暂无提示词</p>'}async function setHotkey(v){await api('set_hotkey',v)}function startRecord(){hotkey.value='请按组合键…';const done=e=>{e.preventDefault();const a=[];if(e.ctrlKey)a.push('Ctrl');if(e.altKey)a.push('Alt');if(e.shiftKey)a.push('Shift');if(!['Control','Alt','Shift'].includes(e.key))a.push(e.key.length===1?e.key.toUpperCase():e.key);if(a.length>=2){const v=a.join('+');hotkey.value=v;setHotkey(v.toLowerCase());window.removeEventListener('keydown',done)}};window.addEventListener('keydown',done)}function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function openForm(){editing=null;formTitle.textContent='新增提示词';title.value='';content.value='';modal.style.display='flex'}function edit(p){editing=p.id;formTitle.textContent='编辑提示词';title.value=p.title;content.value=p.content;modal.style.display='flex'}function closeForm(){modal.style.display='none'}async function save(){if(editing)await api('update_prompt',editing,title.value,content.value,true);else await api('add_prompt',title.value,content.value);closeForm();render()}async function delp(id){if(confirm('删除这条提示词？')){await api('delete_prompt',id);render()}}window.addEventListener('pywebviewready',render);</script></body></html>
